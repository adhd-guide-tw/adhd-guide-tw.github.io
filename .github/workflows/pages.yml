name: Deploy to GitHub Pages

# AI 閘道的網址部署時才寫進頁面，不進 repo（scripts/inject-ai-gateway-url.mjs）。
# 改了 repository variable AI_GATEWAY_URL 之後，到 Actions 頁手動執行這個 workflow 才會生效。
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # 閘道、腳本與 package.json 不放上網站。
      - name: Copy the site
        run: rsync -a --exclude='/.git' --exclude='/.github' --exclude='/.gitignore' --exclude='/ai-gateway' --exclude='/scripts' --exclude='/package.json' --exclude='/_site' ./ _site/
      - name: Write the AI gateway URL into the pages
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: node scripts/inject-ai-gateway-url.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
